<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none" aria-label="XYZ Games.site logo">
  <defs>
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- X Mark with play button integration -->
  <g filter="url(#glow)">
    <!-- X left-to-right diagonal -->
    <rect x="8" y="10" width="8" height="40" rx="4" transform="rotate(-45 30 30)" fill="url(#xGrad)"/>
    <!-- X right-to-left diagonal -->
    <rect x="22" y="10" width="8" height="40" rx="4" transform="rotate(45 30 30)" fill="url(#xGrad)"/>
    <!-- Play triangle integrated into X center -->
    <polygon points="23,22 42,30 23,38" fill="#38BDF8" opacity="0.9"/>
  </g>

  <!-- Brand name text -->
  <text x="58" y="23" font-family="Space Grotesk, Inter, sans-serif" font-weight="800" font-size="22" fill="url(#textGrad)" letter-spacing="-0.5">XYZ</text>
  <text x="58" y="43" font-family="Space Grotesk, Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" letter-spacing="0.5">GAMES</text>

  <!-- .site badge -->
  <rect x="122" y="30" width="38" height="16" rx="8" fill="#8B5CF6" opacity="0.3"/>
  <text x="141" y="42" font-family="Inter, sans-serif" font-weight="600" font-size="10" fill="#38BDF8" text-anchor="middle" letter-spacing="0.5">.site</text>
</svg>
