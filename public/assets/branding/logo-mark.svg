<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none" aria-label="XYZ Games X logo mark">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#12121E"/>
    </linearGradient>
    <linearGradient id="xGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  <!-- Gradient border -->
  <rect x="1" y="1" width="58" height="58" rx="13" fill="none" stroke="url(#xGrad2)" stroke-width="1.5" opacity="0.6"/>

  <!-- X diagonals -->
  <g filter="url(#glow2)">
    <rect x="10" y="12" width="8" height="36" rx="4" transform="rotate(-45 30 30)" fill="url(#xGrad2)"/>
    <rect x="22" y="12" width="8" height="36" rx="4" transform="rotate(45 30 30)" fill="url(#xGrad2)"/>
    <!-- Play arrow -->
    <polygon points="22,21 41,30 22,39" fill="#38BDF8" opacity="0.95"/>
  </g>
</svg>
