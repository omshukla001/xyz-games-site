<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <linearGradient id="bgCid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080814"/>
      <stop offset="100%" stop-color="#14082A"/>
    </linearGradient>
    <linearGradient id="glowCid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF41" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0"/>
    </linearGradient>
    <filter id="gCid"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="sm"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <!-- BG -->
  <rect width="480" height="270" fill="url(#bgCid)"/>

  <!-- City night skyline -->
  <rect x="0"   y="145" width="28"  height="125" fill="#0E0E1E"/>
  <rect x="4"   y="128" width="20"  height="20"  fill="#0E0E1E"/>
  <rect x="32"  y="105" width="42"  height="165" fill="#0C0C1C"/>
  <rect x="42"  y="92"  width="22"  height="16"  fill="#0C0C1C"/>
  <rect x="78"  y="128" width="34"  height="142" fill="#0E0E1E"/>
  <rect x="116" y="112" width="48"  height="158" fill="#0C0C1C"/>
  <rect x="126" y="98"  width="28"  height="17"  fill="#0C0C1C"/>
  <rect x="168" y="130" width="36"  height="140" fill="#0E0E1E"/>
  <rect x="208" y="118" width="52"  height="152" fill="#0C0C1C"/>
  <rect x="264" y="124" width="38"  height="146" fill="#0E0E1E"/>
  <rect x="306" y="100" width="50"  height="170" fill="#0C0C1C"/>
  <rect x="360" y="118" width="38"  height="152" fill="#0E0E1E"/>
  <rect x="402" y="108" width="78"  height="162" fill="#0C0C1C"/>

  <!-- Building windows - amber/yellow glow -->
  <rect x="36"  y="110" width="5" height="6" fill="#FFD600" opacity=".45"/>
  <rect x="46"  y="110" width="5" height="6" fill="#FFD600" opacity=".3"/>
  <rect x="36"  y="122" width="5" height="6" fill="#FFD600" opacity=".5"/>
  <rect x="120" y="118" width="5" height="6" fill="#00FF41" opacity=".4"/>
  <rect x="132" y="118" width="5" height="6" fill="#FFD600" opacity=".4"/>
  <rect x="120" y="130" width="5" height="6" fill="#00FF41" opacity=".3"/>
  <rect x="212" y="124" width="5" height="6" fill="#FFD600" opacity=".45"/>
  <rect x="224" y="124" width="5" height="6" fill="#00FF41" opacity=".35"/>
  <rect x="310" y="108" width="5" height="6" fill="#FFD600" opacity=".5"/>
  <rect x="322" y="108" width="5" height="6" fill="#00FF41" opacity=".4"/>
  <rect x="406" y="116" width="5" height="6" fill="#FFD600" opacity=".4"/>
  <rect x="418" y="116" width="5" height="6" fill="#00FF41" opacity=".35"/>

  <!-- Road -->
  <rect x="0" y="210" width="480" height="60" fill="#111118"/>
  <rect x="0" y="210" width="480" height="2"  fill="url(#glowCid)"/>
  <!-- Road dashes -->
  <rect x="0"   y="236" width="58" height="3" fill="#00FF41" opacity=".5" rx="1.5"/>
  <rect x="78"  y="236" width="58" height="3" fill="#00FF41" opacity=".5" rx="1.5"/>
  <rect x="156" y="236" width="58" height="3" fill="#00FF41" opacity=".5" rx="1.5"/>
  <rect x="234" y="236" width="58" height="3" fill="#00FF41" opacity=".5" rx="1.5"/>
  <rect x="312" y="236" width="58" height="3" fill="#00FF41" opacity=".5" rx="1.5"/>
  <rect x="390" y="236" width="58" height="3" fill="#00FF41" opacity=".5" rx="1.5"/>

  <!-- CID JEEP (white ambassador-style) -->
  <rect x="268" y="192" width="118" height="42" rx="6" fill="#E8E8E8"/>
  <rect x="282" y="178" width="88"  height="22" rx="5" fill="#D0D0D0"/>
  <!-- Windows -->
  <rect x="287" y="181" width="32" height="16" rx="2" fill="#88CCFF" opacity=".75"/>
  <rect x="325" y="181" width="32" height="16" rx="2" fill="#88CCFF" opacity=".75"/>
  <!-- CID label on door -->
  <rect x="275" y="200" width="34" height="14" rx="2" fill="#003399"/>
  <text x="292" y="211" font-family="'Arial Black',Arial" font-size="8" font-weight="900" fill="white" text-anchor="middle" letter-spacing="1">CID</text>
  <rect x="313" y="200" width="34" height="14" rx="2" fill="#003399"/>
  <text x="330" y="211" font-family="'Arial Black',Arial" font-size="8" font-weight="900" fill="white" text-anchor="middle" letter-spacing="1">CID</text>
  <!-- Siren bar -->
  <rect x="285" y="175" width="84" height="6" rx="3" fill="#2255CC"/>
  <rect x="290" y="176" width="14" height="4" rx="1" fill="#FF4444" opacity=".95"/>
  <rect x="308" y="176" width="14" height="4" rx="1" fill="#4488FF" opacity=".95"/>
  <rect x="326" y="176" width="14" height="4" rx="1" fill="#FF4444" opacity=".95"/>
  <rect x="344" y="176" width="14" height="4" rx="1" fill="#4488FF" opacity=".95"/>
  <!-- Siren glow -->
  <circle cx="295" cy="176" r="14" fill="#FF4444" opacity=".18" filter="url(#sm)"/>
  <circle cx="348" cy="176" r="14" fill="#4488FF" opacity=".18" filter="url(#sm)"/>
  <!-- Wheels -->
  <circle cx="295" cy="234" r="11" fill="#222" stroke="#666" stroke-width="2"/>
  <circle cx="295" cy="234" r="5"  fill="#444"/>
  <circle cx="365" cy="234" r="11" fill="#222" stroke="#666" stroke-width="2"/>
  <circle cx="365" cy="234" r="5"  fill="#444"/>
  <!-- Headlight -->
  <rect x="381" y="202" width="6" height="12" rx="2" fill="#FFE87C"/>
  <circle cx="384" cy="208" r="12" fill="#FFE87C" opacity=".2" filter="url(#sm)"/>

  <!-- CID AGENT 1 — hanging out window (comic style) -->
  <!-- Head -->
  <circle cx="310" cy="168" r="10" fill="#C8A060"/>
  <!-- Hair -->
  <rect x="300" y="158" width="20" height="6" rx="3" fill="#2a1a08"/>
  <!-- Hat (CID cap) -->
  <rect x="299" y="154" width="22" height="7" rx="2" fill="#003399"/>
  <rect x="302" y="150" width="16" height="5" rx="2" fill="#0044BB"/>
  <!-- Eyes (wide/shocked) -->
  <circle cx="307" cy="168" r="3"  fill="white"/>
  <circle cx="314" cy="168" r="3"  fill="white"/>
  <circle cx="307" cy="168" r="1.8" fill="#000"/>
  <circle cx="314" cy="168" r="1.8" fill="#000"/>
  <!-- Mouth open -->
  <path d="M306 174 Q310 178 314 174" stroke="#8B4513" stroke-width="1.5" fill="#cc6633"/>
  <!-- Arm pointing / reaching -->
  <line x1="308" y1="178" x2="285" y2="192" stroke="#C8A060" stroke-width="5" stroke-linecap="round"/>
  <circle cx="282" cy="193" r="5" fill="#C8A060"/>

  <!-- CID AGENT 2 — running alongside with magnifying glass -->
  <!-- Shadow -->
  <ellipse cx="210" cy="252" rx="22" ry="5" fill="#000" opacity=".5"/>
  <!-- Legs running -->
  <rect x="198" y="222" width="10" height="28" rx="4" fill="#003399" transform="rotate(-10,198,222)"/>
  <rect x="214" y="218" width="10" height="32" rx="4" fill="#003399" transform="rotate(8,214,218)"/>
  <!-- Shoes -->
  <rect x="192" y="246" width="16" height="6" rx="3" fill="#111"/>
  <rect x="210" y="244" width="16" height="6" rx="3" fill="#111"/>
  <!-- Torso -->
  <rect x="196" y="185" width="30" height="38" rx="5" fill="#0044BB"/>
  <!-- Badge -->
  <rect x="202" y="192" width="10" height="8" rx="1" fill="#FFD600"/>
  <text x="207" y="199" font-family="Arial" font-size="5" font-weight="bold" fill="#000" text-anchor="middle">CID</text>
  <!-- Belt -->
  <rect x="196" y="217" width="30" height="5" rx="2" fill="#111"/>
  <!-- Neck -->
  <rect x="206" y="177" width="10" height="10" rx="3" fill="#C8A060"/>
  <!-- Head -->
  <circle cx="211" cy="167" r="13" fill="#C8A060"/>
  <!-- CID cap -->
  <rect x="198" y="156" width="26" height="8" rx="3" fill="#003399"/>
  <rect x="201" y="152" width="20" height="6" rx="2" fill="#0044BB"/>
  <!-- Mustache (thick comedy) -->
  <rect x="204" y="171" width="14" height="4" rx="2" fill="#2a1a08"/>
  <!-- Eyes squinting -->
  <line x1="206" y1="164" x2="210" y2="164" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="213" y1="164" x2="217" y2="164" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Magnifying glass (held up) -->
  <circle cx="232" cy="155" r="12" fill="none" stroke="#FFD600" stroke-width="3"/>
  <circle cx="232" cy="155" r="9"  fill="#88DDFF" opacity=".3"/>
  <line x1="241" y1="164" x2="250" y2="174" stroke="#FFD600" stroke-width="3" stroke-linecap="round"/>
  <!-- Arm holding magnifier -->
  <line x1="210" y1="193" x2="230" y2="162" stroke="#0044BB" stroke-width="6" stroke-linecap="round"/>

  <!-- RUNNING SUSPECT (green hoodie, fleeing left) -->
  <!-- Shadow -->
  <ellipse cx="130" cy="252" rx="22" ry="5" fill="#000" opacity=".5"/>
  <!-- Legs -->
  <rect x="118" y="220" width="10" height="30" rx="4" fill="#1a1a2a" transform="rotate(12,118,220)"/>
  <rect x="134" y="215" width="10" height="34" rx="4" fill="#1a1a2a" transform="rotate(-8,134,215)"/>
  <!-- Shoes -->
  <rect x="112" y="246" width="16" height="6" rx="3" fill="#222"/>
  <rect x="130" y="244" width="16" height="6" rx="3" fill="#333"/>
  <!-- Body (hoodie) -->
  <rect x="116" y="183" width="32" height="38" rx="5" fill="#00AA33"/>
  <!-- Hood up -->
  <path d="M116 183 Q132 165 148 183" fill="#009922"/>
  <!-- Face in hood -->
  <circle cx="132" cy="178" r="10" fill="#C8A060"/>
  <!-- Eyes (shifty/worried) -->
  <circle cx="128" cy="176" r="2.5" fill="white"/>
  <circle cx="135" cy="176" r="2.5" fill="white"/>
  <circle cx="129" cy="176" r="1.5" fill="#000"/>
  <circle cx="136" cy="176" r="1.5" fill="#000"/>
  <!-- Sweat drops -->
  <circle cx="145" cy="170" r="2" fill="#88CCFF" opacity=".8"/>
  <circle cx="149" cy="176" r="1.5" fill="#88CCFF" opacity=".6"/>
  <!-- Bag of loot -->
  <rect x="100" y="197" width="18" height="16" rx="3" fill="#8B4513" stroke="#A0522D" stroke-width="1"/>
  <text x="109" y="209" font-family="Arial" font-size="9" fill="#FFD700" text-anchor="middle" font-weight="bold">$</text>
  <!-- Bag strap -->
  <line x1="118" y1="197" x2="110" y2="197" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
  <!-- Arms pumping -->
  <line x1="124" y1="195" x2="108" y2="208" stroke="#009922" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="195" x2="155" y2="204" stroke="#009922" stroke-width="6" stroke-linecap="round"/>

  <!-- Speed lines from suspect -->
  <line x1="112" y1="202" x2="80"  y2="202" stroke="#00FF41" stroke-width="1.5" opacity=".55"/>
  <line x1="110" y1="210" x2="75"  y2="210" stroke="#00FF41" stroke-width="1"   opacity=".4"/>
  <line x1="108" y1="218" x2="72"  y2="218" stroke="#00FF41" stroke-width="1"   opacity=".3"/>

  <!-- Comedy "!" above CID agent -->
  <text x="234" y="140" font-family="'Arial Black',Arial" font-size="22" font-weight="900" fill="#FFD600" text-anchor="middle" filter="url(#gCid)" opacity=".95">!</text>

  <!-- Title overlay -->
  <rect x="0" y="0" width="480" height="78" fill="#08080E" opacity=".6"/>

  <!-- TITLE -->
  <text x="240" y="34" font-family="'Arial Black',Arial" font-weight="900" font-size="30" fill="white" text-anchor="middle" filter="url(#gCid)" letter-spacing="1">CHODU CID</text>
  <!-- Green underline -->
  <rect x="105" y="41" width="270" height="3" rx="1.5" fill="#00FF41" opacity=".9"/>
  <!-- Sub -->
  <text x="240" y="62" font-family="Arial" font-size="11" fill="#00FF41" text-anchor="middle" letter-spacing="2.5">ENDLESS CHASE · OUTSMART THE DETECTIVES</text>

  <!-- Badge -->
  <rect x="16" y="246" width="60" height="18" rx="9" fill="#00FF41"/>
  <text x="46" y="258" font-family="Arial" font-weight="900" font-size="9" fill="#000" text-anchor="middle" letter-spacing="1">ENDLESS RUN</text>

  <!-- Play button -->
  <circle cx="456" cy="255" r="12" fill="#00FF41" opacity=".9"/>
  <polygon points="451,249 451,261 463,255" fill="#000"/>
</svg>
